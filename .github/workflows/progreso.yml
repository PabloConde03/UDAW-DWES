name: Actualizar progreso

on:
  push:
    branches: [Pablo]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  progreso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerar PROGRESO.md
        run: php tools/generar-progreso.php

      - name: Commit si ha cambiado
        run: |
          if git diff --quiet; then
            echo "PROGRESO.md ya estaba al día."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(progreso): actualizar PROGRESO.md [skip ci]"
          git push
